       <style>
.gallery img {
  width: 50%;
  height: 600px;
  object-fit: cover;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.3s;
}
       </style>
<!-- GALLERY -->
<div class="gallery">
  <img src="Images/Lilac-Enamel-Cross-Ring_.webp" onclick="openLightbox(0)">
  <img src="Images/John-3-16-Lightweight-Beanie_.webp" onclick="openLightbox(1)">
  <img src="Images/The-Sacrifice-Camo-Unisex-Hoodie_.webp" onclick="openLightbox(2)">
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

  <span class="close" onclick="closeLightbox()">&times;</span>

  <div class="nav">
    <span onclick="changeSlide(-1)">&#10094;</span>
    <span onclick="changeSlide(1)">&#10095;</span>
  </div>
  <img id="lightbox-img">
  <div class="caption" id="caption"></div>
</div>
<script>

const images = [
  "Images/Lilac-Enamel-Cross-Ring_.webp",
  "Images/John-3-16-Lightweight-Beanie_.webp",
  "Images/The-Sacrifice-Camo-Unisex-Hoodie_.webp"
];

let currentIndex = 0;

function openLightbox(index) {
  currentIndex = index;
  document.getElementById("lightbox").style.display = "flex";
  updateImage();
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function changeSlide(step) {
  currentIndex += step;

  if (currentIndex < 0) currentIndex = images.length - 1;
  if (currentIndex >= images.length) currentIndex = 0;

  updateImage();
}

function updateImage() {
  document.getElementById("lightbox-img").src = images[currentIndex];
  document.getElementById("caption").innerText =
    `Item ${currentIndex + 1} of ${images.length}`;
}
</script>
